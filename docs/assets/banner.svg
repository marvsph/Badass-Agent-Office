    <text x="58" y="263" fill="#f6edd7" font-size="94" font-weight="800" letter-spacing="-4">AGENT OFFICE<tspan fill="#e99b78">.</tspan></text>
    <text x="64" y="320" fill="#d6dec9" font-size="24">Your agents. One address.</text>
    <text x="64" y="355" fill="#a7bba5" font-size="17">Real recorded activity. A whole little world to watch.</text>
    <text x="64" y="411" fill="#eaa581" font-size="12" font-weight="600" letter-spacing="2.5">LOCAL BY DESIGN</text>
    <text x="262" y="411" fill="#a7bba5" font-size="12" letter-spacing="2">CODEX / CLAUDE CODE / COPILOT CLI</text>
  </g>
