<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Badass Agent Office</title>
  <desc id="desc">Your agents. One address. A local pixel office for Codex, Claude Code, and Copilot CLI.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b7d0ac" opacity=".12"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#132e2b"/><stop offset="1" stop-color="#223d34"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#a4c5a0"/><stop offset="1" stop-color="#668b79"/></linearGradient>
  </defs>
  <rect width="1400" height="460" rx="20" fill="url(#bg)"/>
